services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: vemtap_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Nov52002#"
      POSTGRES_DB: vemtap
    ports:
      - "5432:5432"
    volumes:
      - vemtap_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vemtap_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  vemtap_postgres_data:
