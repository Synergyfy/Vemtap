name: Deploy to VPS

on:
  push:
    branches: [ main ] # Change this to mono-master if that is your main branch!

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: test_db_password
          POSTGRES_DB: neondb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Run Build (Strict Type Check)
      run: pnpm --filter @vemtap/backend build

    - name: Verify Schema Sync
      run: pnpm --filter @vemtap/backend typeorm schema:log
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: neondb_owner
        DB_PASSWORD: test_db_password
        DB_NAME: neondb_test
        DB_SSL: false

    - name: Run Unit Tests
      run: pnpm --filter @vemtap/backend test

    - name: Run E2E Tests
      run: pnpm --filter @vemtap/backend test:e2e
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: neondb_owner
        DB_PASSWORD: test_db_password
        DB_NAME: neondb_test
        DB_SSL: false
        JWT_SECRET: test-secret-key-1234567890
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        PAYSTACK_SECRET_KEY: sk_test_12345
        ADMIN_ACCOUNT_CODE: admin-code-123
        TERMII_API_KEY: termii-key-123

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to the workspace directory
            # Make sure you clone your repository to this directory on the VPS first!
            cd ~/vemtap-workspace
            
            # Pull latest changes from the repository
            git pull origin main
            
            # Install dependencies
            pnpm install
            
            # Build both frontend and backend using turborepo
            pnpm build
            
            # Restart PM2 processes
            pm2 restart vemtap-api vemtap-web
