<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-container": "#9c9af4",
                      "error": "#ba1a1a",
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#d9e3f4",
                      "tertiary-container": "#363a40",
                      "on-tertiary-fixed-variant": "#43474d",
                      "secondary-container": "#6063ee",
                      "surface-bright": "#f8f9ff",
                      "inverse-surface": "#27313e",
                      "surface-tint": "#5654a8",
                      "surface-dim": "#d1dbec",
                      "primary-fixed": "#e2dfff",
                      "primary-container": "#312e81",
                      "on-primary-fixed": "#100563",
                      "inverse-primary": "#c3c0ff",
                      "surface": "#f8f9ff",
                      "surface-container": "#e5eeff",
                      "surface-container-highest": "#d9e3f4",
                      "on-surface-variant": "#474651",
                      "on-surface": "#121c28",
                      "on-primary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "on-secondary-container": "#fffbff",
                      "surface-container-high": "#dfe9fa",
                      "secondary-fixed": "#e1e0ff",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed": "#181c21",
                      "outline": "#777682",
                      "tertiary": "#20252a",
                      "on-tertiary-container": "#a0a4ab",
                      "tertiary-fixed": "#dfe2ea",
                      "secondary": "#4648d4",
                      "primary-fixed-dim": "#c3c0ff",
                      "on-background": "#121c28",
                      "primary": "#1a146b",
                      "outline-variant": "#c8c5d3",
                      "tertiary-fixed-dim": "#c3c6ce",
                      "on-secondary-fixed": "#07006c",
                      "on-secondary-fixed-variant": "#2f2ebe",
                      "surface-container-lowest": "#ffffff",
                      "on-primary-fixed-variant": "#3e3c8f",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#eef4ff",
                      "secondary-fixed-dim": "#c0c1ff",
                      "inverse-on-surface": "#eaf1ff",
                      "on-error-container": "#93000a",
                      "background": "#f8f9ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "48px",
                      "container-max": "1280px",
                      "xl": "80px",
                      "xs": "4px",
                      "grid-columns": "12",
                      "md": "24px",
                      "sm": "12px",
                      "base": "8px"
              },
              "fontFamily": {
                      "headline-h2": ["Inter"],
                      "body-sm": ["Inter"],
                      "display-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "label-caps": ["Inter"],
                      "headline-h1": ["Inter"]
              },
              "fontSize": {
                      "headline-h2": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-h1": ["32px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-0 m-0 overflow-hidden">
<!-- Screen 1: Welcome / Loading State -->
<main class="relative w-full max-w-[430px] h-screen bg-surface flex flex-col items-center justify-between py-xl px-md overflow-hidden">
<!-- Top Visual Accent (Abstract Background) -->
<div class="absolute top-0 left-0 w-full h-1/2 opacity-10 pointer-events-none">
<div class="w-full h-full bg-gradient-to-b from-secondary to-transparent"></div>
</div>
<!-- Centered Branding Content -->
<div class="flex-1 flex flex-col items-center justify-center z-10 w-full">
<div class="mb-md p-sm bg-white rounded-3xl shadow-sm border border-surface-container">
<div class="w-24 h-24 flex items-center justify-center bg-primary-container rounded-2xl">
<span class="material-symbols-outlined text-on-primary-container text-[48px]" data-icon="storefront">storefront</span>
</div>
</div>
<div class="text-center space-y-sm px-md">
<h1 class="font-headline-h1 text-headline-h1 text-primary">Vemtap</h1>
<p class="font-headline-h2 text-headline-h2 text-on-surface-variant">Welcome to our store</p>
<p class="font-body-md text-body-md text-outline max-w-[280px] mx-auto mt-sm">Connecting you with our latest collections and exclusive experiences.</p>
</div>
</div>
<!-- Footer Action (Enter Button) -->
<div class="w-full px-md pb-md z-10">
<button class="w-full py-md bg-primary text-on-primary font-headline-h2 text-headline-h2 rounded-xl shadow-lg hover:opacity-90 active:scale-95 transition-all">
                Enter
            </button>
<div class="mt-md flex justify-center space-x-base">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="w-2 h-2 rounded-full bg-surface-container-highest"></span>
<span class="w-2 h-2 rounded-full bg-surface-container-highest"></span>
</div>
</div>
<!-- Screen 2: Visitor Form Popup (Bottom Sheet Overlay) -->
<div class="absolute inset-0 bg-black/40 z-20 flex flex-col justify-end">
<!-- Background Image behind the sheet for context -->
<div class="absolute inset-0 -z-10 bg-white">
<img class="w-full h-full object-cover opacity-20 grayscale" data-alt="A luxurious minimalist retail store interior with soft overhead lighting and clean white architectural lines. The space features premium marble flooring and a warm indigo accent wall in the background. The atmosphere is serene, high-end, and professional, reflecting a modern corporate aesthetic with generous white space and soft shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKWEAjOeqBr97TP37DxkGwlWf83GrUk9BBg8CYyK-cGV_XDt5j6NBaVML_4xVO3xYhIaL_HO01E8EZW-NSkPx4wpyRT9s35IqLErkPL_m0GRyIctQbUSHET83ClO6LdYkQuDcEWwazFU9RTCMkcEFShxngbyORGU03lqtWW-pN7hkEoJfTJTAdncudDfxMsoBQuGwdEU1AnF7Vbnds-D0LgNVPs0VWrDLPCdRbOdvlf4fKT2g2TT3qiF8i-Nec3WU1HHuMi9FAL7ue"/>
</div>
<!-- Bottom Sheet Content -->
<div class="bg-surface-container-lowest w-full rounded-t-[32px] shadow-[0_-8px_32px_rgba(0,0,0,0.1)] px-md pt-base pb-lg animate-in slide-in-from-bottom duration-500">
<!-- Drag Handle -->
<div class="flex justify-center mb-md">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="mb-lg">
<h2 class="font-headline-h1 text-headline-h1 text-primary mb-xs">Stay Connected</h2>
<p class="font-body-md text-body-md text-on-surface-variant">We'd love to know more about you for a personalized experience.</p>
</div>
<!-- Form Fields -->
<div class="space-y-md mb-xl">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline px-sm">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-secondary text-body-md font-body-md" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline px-sm">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-secondary text-body-md font-body-md" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline px-sm">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-secondary text-body-md font-body-md" placeholder="john@example.com" type="email"/>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="space-y-sm">
<button class="w-full py-md bg-secondary text-on-secondary font-headline-h2 text-headline-h2 rounded-xl shadow-md hover:bg-on-secondary-fixed-variant transition-colors">
                        Submit
                    </button>
<button class="w-full py-sm bg-transparent text-outline font-label-caps text-label-caps tracking-widest uppercase hover:text-on-surface-variant transition-colors">
                        Skip for now
                    </button>
</div>
</div>
</div>
</main>
<!-- Contextual FAB (Hidden on welcome/form by task logic, but structure ready) -->
<button class="hidden fixed bottom-md right-md w-14 h-14 bg-primary text-on-primary rounded-full shadow-xl flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</body></html>
