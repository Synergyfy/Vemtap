<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Account Entry / Sign In - VEMTAP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#b0c6ff",
                        "surface-bright": "#f7f9fb",
                        "tertiary-fixed": "#dae2fd",
                        "on-tertiary-fixed": "#131b2e",
                        "surface-container-highest": "#e0e3e5",
                        "primary-fixed": "#d9e2ff",
                        "surface-container-high": "#e6e8ea",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#b0c6ff",
                        "tertiary-fixed-dim": "#bec6e0",
                        "background": "#f7f9fb",
                        "outline": "#727786",
                        "primary": "#0055c4",
                        "inverse-on-surface": "#eff1f3",
                        "surface-dim": "#d8dadc",
                        "on-surface-variant": "#424655",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d3e4fe",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed-variant": "#00429b",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-container": "#54647a",
                        "surface-container": "#eceef0",
                        "on-primary-container": "#fcfaff",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#6b738a",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c2c6d7",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error": "#ffffff",
                        "tertiary": "#535a71",
                        "secondary": "#505f76",
                        "primary-container": "#066cf4",
                        "on-tertiary-container": "#fcfaff",
                        "on-primary-fixed": "#001945",
                        "inverse-surface": "#2d3133",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#0058cb",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "on-background": "#191c1e",
                        "secondary-container": "#d0e1fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "touch-target-min": "44px",
                        "stack-sm": "0.5rem",
                        "stack-lg": "1.5rem",
                        "margin-main": "1.25rem",
                        "gutter-grid": "1rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "currency-display": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "currency-display": ["20px", { "lineHeight": "24px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col justify-between overflow-x-hidden pt-[76px] pb-[80px]">
<!-- Main Content Area -->
<main class="flex-grow px-margin-main flex flex-col justify-center max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="mb-stack-lg mt-8">
<h1 class="text-display-lg font-display-lg text-primary mb-2">Welcome back</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Please log in to your account to continue discovering local favorites.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Email Field -->
<div>
<label class="block text-label-lg font-label-lg text-on-surface mb-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-touch-target-min pl-10 pr-4 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary text-body-lg font-body-lg text-on-surface placeholder-outline transition-colors duration-200" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-label-lg font-label-lg text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-touch-target-min pl-10 pr-12 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary text-body-lg font-body-lg text-on-surface placeholder-outline transition-colors duration-200" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="text-label-lg font-label-lg text-primary hover:underline" href="#">Forgot password?</a>
</div>
</div>
<!-- Primary CTA -->
<button class="mt-4 w-full h-touch-target-min bg-primary text-on-primary rounded-lg text-label-lg font-label-lg flex items-center justify-center gap-2 hover:bg-primary-container transition-colors duration-200 active:scale-[0.98]" type="button">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-stack-lg w-full">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="px-4 text-label-sm font-label-sm text-outline">OR</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- OAuth Section -->
<button class="w-full h-touch-target-min bg-surface border border-outline-variant text-on-surface rounded-lg text-label-lg font-label-lg flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors duration-200 active:scale-[0.98]" type="button">
<!-- Google Logo SVG approximation -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Footer Links -->
<div class="mt-auto pt-8 flex flex-col items-center gap-4 text-body-md font-body-md">
<p class="text-on-surface-variant">Don't have an account? <a class="text-primary font-label-lg font-bold hover:underline" href="#">Create Account</a></p>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Continue as Guest</a>
</div>
</main>
<!-- BottomNavBar (from JSON, strictly adhered) -->
<!-- Note: While a login screen typically suppresses nav, the prompt explicitly demands "Bottom Nav: ACTIVE: ACCOUNT". -->
<!-- Conflict Resolution: The prompt overrides standard suppression logic for this specific task. -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 h-touch-target-min bg-surface dark:bg-on-background docked full-width rounded-t-xl shadow-[0_-2px_10px_rgba(0,0,0,0.05)] md:hidden">
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:opacity-80 active:scale-95 transition-transform duration-150 w-16 group" href="#">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:text-primary transition-colors">home</span>
<span class="text-label-sm font-label-sm group-hover:text-primary transition-colors">HOME</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:opacity-80 active:scale-95 transition-transform duration-150 w-16 group" href="#">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:text-primary transition-colors">explore</span>
<span class="text-label-sm font-label-sm group-hover:text-primary transition-colors">DISCOVER</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:opacity-80 active:scale-95 transition-transform duration-150 w-16 group" href="#">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:text-primary transition-colors">local_offer</span>
<span class="text-label-sm font-label-sm group-hover:text-primary transition-colors">DEALS</span>
</a>
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant hover:opacity-80 active:scale-95 transition-transform duration-150 w-16 group" href="#">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:text-primary transition-colors">bookmark</span>
<span class="text-label-sm font-label-sm group-hover:text-primary transition-colors">SAVED</span>
</a>
<!-- Active State for ACCOUNT -->
<a class="flex flex-col items-center justify-center text-primary dark:text-inverse-primary font-bold hover:opacity-80 active:scale-95 transition-transform duration-150 w-16 group" href="#">
<span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-sm font-label-sm">ACCOUNT</span>
</a>
</nav>
</body></html>
