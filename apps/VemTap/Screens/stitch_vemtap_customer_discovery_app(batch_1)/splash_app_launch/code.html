<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VEMTAP Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#b0c6ff",
                        "surface-bright": "#f7f9fb",
                        "tertiary-fixed": "#dae2fd",
                        "on-tertiary-fixed": "#131b2e",
                        "surface-container-highest": "#e0e3e5",
                        "primary-fixed": "#d9e2ff",
                        "surface-container-high": "#e6e8ea",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#b0c6ff",
                        "tertiary-fixed-dim": "#bec6e0",
                        "background": "#f7f9fb",
                        "outline": "#727786",
                        "primary": "#0055c4",
                        "inverse-on-surface": "#eff1f3",
                        "surface-dim": "#d8dadc",
                        "on-surface-variant": "#424655",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d3e4fe",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed-variant": "#00429b",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-container": "#54647a",
                        "surface-container": "#eceef0",
                        "on-primary-container": "#fcfaff",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#6b738a",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c2c6d7",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error": "#ffffff",
                        "tertiary": "#535a71",
                        "secondary": "#505f76",
                        "primary-container": "#066cf4",
                        "on-tertiary-container": "#fcfaff",
                        "on-primary-fixed": "#001945",
                        "inverse-surface": "#2d3133",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#0058cb",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "on-background": "#191c1e",
                        "secondary-container": "#d0e1fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "touch-target-min": "44px",
                        "stack-sm": "0.5rem",
                        "stack-lg": "1.5rem",
                        "margin-main": "1.25rem",
                        "gutter-grid": "1rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "currency-display": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "currency-display": ["20px", { "lineHeight": "24px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .loading-dot {
            animation: pulse-dot 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes pulse-dot {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full bg-surface-bright flex flex-col items-center justify-center m-0 p-0 overflow-hidden font-body-md text-on-background">
<div class="flex flex-col items-center justify-center flex-1 w-full max-w-sm px-margin-main z-10 relative">
<!-- Logo Area -->
<div class="mb-stack-lg fade-in-up flex items-center justify-center">
<h1 class="text-display-lg font-display-lg text-primary tracking-tighter m-0">VEMTAP</h1>
</div>
<!-- Loading Indicator -->
<div class="flex space-x-2 mb-stack-lg h-6 items-center justify-center fade-in-up" style="animation-delay: 0.2s;">
<div class="w-2 h-2 bg-primary rounded-full loading-dot"></div>
<div class="w-2 h-2 bg-primary rounded-full loading-dot"></div>
<div class="w-2 h-2 bg-primary rounded-full loading-dot"></div>
</div>
<!-- Tagline -->
<p class="text-body-md font-body-md text-on-surface-variant text-center fade-in-up m-0" style="animation-delay: 0.4s;">
            Discover what's around you.
        </p>
</div>
<!-- Very subtle background texture/gradient to maintain a premium feel without being distracting -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary-fixed-dim via-transparent to-transparent"></div>
</body></html>
