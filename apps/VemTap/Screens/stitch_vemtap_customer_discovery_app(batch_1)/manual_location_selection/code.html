<body class="bg-background text-on-background h-full flex flex-col font-body-md overflow-hidden antialiased">
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-margin-main py-stack-sm bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline shrink-0">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface hover:bg-surface-container-low rounded-full transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary dark:text-inverse-primary">Choose Your Location</h1>
<div class="w-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-margin-main py-stack-lg flex flex-col gap-stack-lg">
<!-- Search Input Section -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="search">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary text-body-lg font-body-lg transition-colors" placeholder="Search city, area or neighbourhood" type="text" value="Wuse 2, Abuja"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Current Location Button -->
<button class="flex items-center gap-3 p-3 rounded-xl hover:bg-surface-container-low transition-colors w-full text-left">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="my_location" data-weight="fill" style="font-variation-settings: 'FILL' 1;">my_location</span>
</div>
<div>
<div class="text-label-lg font-label-lg text-primary">Use current location</div>
<div class="text-label-sm font-label-sm text-outline">Enable location services</div>
</div>
</button>
<!-- Divider -->
<div class="h-px bg-outline-variant/30 w-full"></div>
<!-- Suggested Locations List -->
<div>
<h2 class="text-label-sm font-label-sm text-outline uppercase tracking-wider mb-stack-md px-2">Suggested Locations</h2>
<div class="flex flex-col gap-2">
<!-- Location Item 1 (Selected) -->
<button class="flex items-center justify-between p-4 rounded-xl border border-primary bg-primary-container/5 w-full text-left transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<span class="text-body-lg font-body-lg text-on-surface font-medium">Wuse 2</span>
</div>
<span class="material-symbols-outlined text-primary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Location Item 2 -->
<button class="flex items-center justify-between p-4 rounded-xl border border-transparent hover:bg-surface-container-low w-full text-left transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline" data-icon="location_on">location_on</span>
<span class="text-body-lg font-body-lg text-on-surface">Garki</span>
</div>
</button>
<!-- Location Item 3 -->
<button class="flex items-center justify-between p-4 rounded-xl border border-transparent hover:bg-surface-container-low w-full text-left transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline" data-icon="location_on">location_on</span>
<span class="text-body-lg font-body-lg text-on-surface">Maitama</span>
</div>
</button>
<!-- Location Item 4 -->
<button class="flex items-center justify-between p-4 rounded-xl border border-transparent hover:bg-surface-container-low w-full text-left transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline" data-icon="location_on">location_on</span>
<span class="text-body-lg font-body-lg text-on-surface">Apo</span>
</div>
</button>
<!-- Location Item 5 -->
<button class="flex items-center justify-between p-4 rounded-xl border border-transparent hover:bg-surface-container-low w-full text-left transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline" data-icon="location_on">location_on</span>
<span class="text-body-lg font-body-lg text-on-surface">Gwarinpa</span>
</div>
</button>
</div>
</div>

        </button>
