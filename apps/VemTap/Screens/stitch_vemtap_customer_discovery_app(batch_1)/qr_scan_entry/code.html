<style>
        .scanner-frame {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
        }

        .scanner-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #0055c4; /* VEMTAP Blue */
            border-style: solid;
            border-width: 0;
            border-radius: 12px;
        }

        .corner-tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 20px; }
        .corner-tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 20px; }
        .corner-bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 20px; }
        .corner-br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 20px; }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #0055c4;
            box-shadow: 0 0 8px #0055c4;
            animation: scan 2.5s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        .camera-feed {
            background-color: #191c1e; /* Dark background to simulate camera inactive */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-full flex flex-col antialiased font-sans">
<!-- Top Navigation (Task Focused - No Bottom Nav) -->
<header class="w-full px-margin-main py-stack-sm flex justify-between items-center bg-transparent absolute top-0 left-0 right-0 z-50">
<!-- Close/Back Action -->
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-highest/50 backdrop-blur-sm text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<!-- Header Text -->
<h1 class="text-headline-sm font-headline-sm text-on-surface drop-shadow-md">Scan</h1>
<!-- Flash Toggle Placeholder -->
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-highest/50 backdrop-blur-sm text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">flashlight_on</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative w-full h-full">
<!-- Simulated Camera Background -->
<div class="absolute inset-0 z-0 camera-feed w-full h-full">
<div class="bg-cover bg-center w-full h-full opacity-60" data-alt="A slightly blurred view through a mobile phone camera lens in a modern urban environment. The scene is brightly lit with a light-mode aesthetic, showcasing a clean street scene in Nigeria with modern architecture. Soft lighting and depth of field create a realistic viewfinder effect." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDqeEPKxxccFbQDMHmt6gpKitLPqksriGD0oUD97XLVTSWSqqz1zQTF-g8PeSdXgPFVz8r7oDgcfZfCEmXltHjuRY9txKDS-WYxB7RvM6X1Ag5gE6vNvTccjeX1Lv5S9oX8_bfyJHU4fW0H011VRpuKEimhGnrz_zQwBnLxlbvriKQDyewa1EDTn7Jar4IqOUlmtfFkQo0M_PpiehTlHwFugCVkWQ-EP-7w7vI5WQp1Opruj0MTNe2woQ')"></div>
</div>
<!-- Scanner UI Overlay -->
<div class="relative z-10 flex flex-col flex-1 mt-24 px-margin-main items-center justify-center">
<!-- Viewfinder Frame -->
<div class="scanner-frame relative z-20 mb-8">
<div class="scanner-corner corner-tl"></div>
<div class="scanner-corner corner-tr"></div>
<div class="scanner-corner corner-bl"></div>
<div class="scanner-corner corner-br"></div>
<div class="scan-line"></div>
</div>
<!-- Instructional Text -->
<div class="text-center z-20 mb-10 max-w-sm px-4">
<h2 class="text-headline-md font-headline-md text-on-primary mb-2 drop-shadow-lg">Scan a VEMTAP QR code</h2>
<p class="text-body-md font-body-md text-surface-container-highest drop-shadow-md">Discover the business, deal or experience connected to this code.</p>
</div>
<!-- Manual Input Alternative (Bottom Sheet style docked to bottom) -->
<div class="absolute bottom-0 left-0 right-0 bg-surface w-full rounded-t-xl px-margin-main py-6 pb-10 shadow-[0_-8px_24px_rgba(0,0,0,0.12)]">
<!-- Drag Handle (Visual only) -->
<div class="w-10 h-1 bg-outline-variant rounded-full mx-auto mb-6"></div>
<div class="flex flex-col gap-4">
<label class="text-label-lg font-label-lg text-on-surface font-semibold text-center w-full block" for="manual-link">Or enter a VEMTAP link</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-variation-settings: 'FILL' 0;">link</span>
<input class="w-full h-14 pl-12 pr-4 rounded-lg border border-outline-variant bg-surface text-body-lg font-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant" id="manual-link" placeholder="vemtap.com/..." type="text"/>
<button class="absolute right-2 w-10 h-10 flex items-center justify-center bg-primary text-on-primary rounded-md hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
</main>
