<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Deal Sort</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#0b1c30",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface-variant": "#424655",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed": "#001945",
                        "on-error-container": "#93000a",
                        "secondary-container": "#d0e1fb",
                        "on-primary-fixed-variant": "#00429b",
                        "surface-dim": "#d8dadc",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#505f76",
                        "tertiary": "#535a71",
                        "tertiary-container": "#6b738a",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed": "#131b2e",
                        "primary": "#0055c4",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "error": "#ba1a1a",
                        "on-background": "#191c1e",
                        "primary-container": "#066cf4",
                        "surface-tint": "#0058cb",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "tertiary-fixed": "#dae2fd",
                        "surface-bright": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "secondary-fixed-dim": "#b7c8e1",
                        "outline": "#727786",
                        "on-surface": "#191c1e",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#bec6e0",
                        "on-secondary-container": "#54647a",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#fcfaff",
                        "outline-variant": "#c2c6d7",
                        "surface-container-high": "#e6e8ea",
                        "primary-fixed": "#d9e2ff",
                        "on-primary-container": "#fcfaff",
                        "inverse-primary": "#b0c6ff",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#b0c6ff",
                        "surface-variant": "#e0e3e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "44px",
                        "margin-main": "1.25rem",
                        "stack-sm": "0.5rem",
                        "gutter-grid": "1rem",
                        "stack-lg": "1.5rem",
                        "stack-md": "1rem"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "currency-display": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "currency-display": ["20px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-full font-body-lg">
<!-- Dimmed Background (Simulating search results behind the sheet) -->
<div aria-hidden="true" class="fixed inset-0 bg-on-surface/40 z-40 transition-opacity duration-300"></div>
<!-- Bottom Sheet Container -->
<div aria-labelledby="sort-title" aria-modal="true" class="fixed inset-x-0 bottom-0 z-50 transform transition-transform duration-300 ease-out translate-y-0 max-w-md mx-auto w-full" role="dialog">
<div class="bg-surface-container-lowest rounded-t-[28px] shadow-lg flex flex-col max-h-[795px]">
<!-- Handle -->
<div class="flex justify-center pt-4 pb-2 w-full shrink-0">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-margin-main pb-4 shrink-0 flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-on-surface" id="sort-title">Sort by</h2>
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant active:scale-95 duration-100" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content / Scrollable Area -->
<div class="overflow-y-auto px-margin-main pb-stack-lg flex-1">
<form id="sort-form">
<div aria-labelledby="sort-title" class="flex flex-col gap-stack-sm" role="radiogroup">
<!-- Option 1: Popular (Selected) -->
<label class="flex items-center justify-between p-4 rounded-xl border border-primary bg-primary-container/10 cursor-pointer transition-all active:scale-[0.98]">
<span class="font-body-lg text-body-lg text-on-surface">Popular</span>
<div class="relative flex items-center justify-center w-6 h-6">
<input checked="" class="peer sr-only" name="sort_option" type="radio" value="popular"/>
<div class="w-5 h-5 rounded-full border-2 border-primary peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Option 2: Newest -->
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]">
<span class="font-body-lg text-body-lg text-on-surface">Newest</span>
<div class="relative flex items-center justify-center w-6 h-6">
<input class="peer sr-only" name="sort_option" type="radio" value="newest"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Option 3: Trending -->
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]">
<span class="font-body-lg text-body-lg text-on-surface">Trending</span>
<div class="relative flex items-center justify-center w-6 h-6">
<input class="peer sr-only" name="sort_option" type="radio" value="trending"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Option 4: Featured -->
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]">
<span class="font-body-lg text-body-lg text-on-surface">Featured</span>
<div class="relative flex items-center justify-center w-6 h-6">
<input class="peer sr-only" name="sort_option" type="radio" value="featured"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Option 5: Price: Low to High -->
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]">
<span class="font-body-lg text-body-lg text-on-surface">Price: Low to High</span>
<div class="relative flex items-center justify-center w-6 h-6">
<input class="peer sr-only" name="sort_option" type="radio" value="price_asc"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Option 6: Price: High to Low -->
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]">
<span class="font-body-lg text-body-lg text-on-surface">Price: High to Low</span>
<div class="relative flex items-center justify-center w-6 h-6">
<input class="peer sr-only" name="sort_option" type="radio" value="price_desc"/>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
</div>
</form>
</div>
<!-- Footer / Action -->
<div class="p-margin-main shrink-0 border-t border-surface-variant bg-surface-container-lowest pb-8">
<button class="w-full h-12 min-h-[48px] bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors active:scale-95 duration-200 shadow-sm" form="sort-form" type="submit">
                    Apply
                </button>
</div>
</div>
</div>
<script>
        // Basic interaction script for radio button styling updates
        const radioLabels = document.querySelectorAll('label');
        
        radioLabels.forEach(label => {
            const input = label.querySelector('input[type="radio"]');
            
            input.addEventListener('change', (e) => {
                if(e.target.checked) {
                    // Reset all
                    radioLabels.forEach(l => {
                        l.classList.remove('border-primary', 'bg-primary-container/10');
                        l.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                    });
                    
                    // Apply to selected
                    label.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    label.classList.add('border-primary', 'bg-primary-container/10');
                }
            });
        });
    </script>
</body></html>
