<script>
        // Simple double tap to zoom interaction for demonstration
        const img = document.getElementById('main-hero-image');
        let isZoomed = false;

        img.addEventListener('dblclick', () => {
            isZoomed = !isZoomed;
            if(isZoomed) {
                img.classList.remove('scale-100', 'object-contain', 'cursor-zoom-in');
                img.classList.add('scale-[2]', 'object-cover', 'cursor-zoom-out');
            } else {
                img.classList.add('scale-100', 'object-contain', 'cursor-zoom-in');
                img.classList.remove('scale-[2]', 'object-cover', 'cursor-zoom-out');
                // Reset transform if dragged
                img.style.transform = '';
            }
        });
    </script>
