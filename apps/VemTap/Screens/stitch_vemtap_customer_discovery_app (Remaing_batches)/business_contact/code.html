<!DOCTYPE html>

                        "tertiary-fixed": "#dae2fd",
                        "on-surface": "#191c1e",
                        "inverse-primary": "#b0c6ff",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2d3133",

<style>
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .safe-area-top { padding-top: env(safe-area-inset-top); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col safe-area-top safe-area-bottom">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant fixed top-0 w-full z-50 flex items-center justify-between px-margin-main h-[64px] max-w-full">
<button aria-label="Go back" class="text-primary hover:bg-surface-container-low transition-colors rounded-full p-2 -ml-2 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary truncate flex-1 text-center px-4">Contact Business</h1>
<button aria-label="Share" class="text-primary hover:bg-surface-container-low transition-colors rounded-full p-2 -mr-2 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">share</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-[64px] px-margin-main pb-24 max-w-md mx-auto w-full">
<!-- Business Info Summary -->
<section class="mt-stack-lg mb-8 flex flex-col items-center text-center">
<div class="w-24 h-24 rounded-full bg-surface-container-highest border border-outline-variant shadow-sm overflow-hidden mb-4 relative flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A high quality, professionally lit, mouth-watering close up food photography shot of a delicious Nigerian Jollof rice dish with grilled chicken, served in a clean modern white bowl. Bright, modern light-mode aesthetic with corporate blue accents. Soft studio lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBuxIjcXnjdfHepm3g6gEiQgTKnfP70NaQnxDypI_sGr2QK_VUivKRUb-JOFHg0oLo1mYojgh5WauRozGcx3FbyWMTfdAaZsU_nrK9ODQMvbJqnEmF-1mU4fVGcXCIthF1Y5EWUzLClPG9V6BWs70tWyXVJbfs4RiYYCmPq8hfp6Uc9z9xRfrd3jgtXg2oNfTK4bIYdtSYJaFUx7wI9l1CZFsqO8Q888xDlF9wTfcfAh57aspZ0PT0Whw"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Royal Spice Restaurant</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                Victoria Island, Lagos
            </p>
</section>
<!-- Contact Grid (Bento Style) -->
<section class="grid grid-cols-2 gap-gutter-grid">
<!-- Call -->
<button class="col-span-2 sm:col-span-1 bg-surface border border-outline-variant rounded-xl p-6 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors active:scale-[0.98] group">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">call</span>
</div>
<div class="text-center">
<h3 class="font-label-lg text-label-lg text-on-surface mb-1">Call Restaurant</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-[13px]">+234 800 123 4567</p>
</div>
</button>
<!-- WhatsApp -->
<button class="col-span-2 sm:col-span-1 bg-surface border border-outline-variant rounded-xl p-6 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors active:scale-[0.98] group">
<div class="w-12 h-12 rounded-full bg-[#25D366]/10 flex items-center justify-center text-[#25D366] group-hover:scale-110 transition-transform">
<!-- Using chat as whatsapp alternative icon -->
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">chat</span>
</div>
<div class="text-center">
<h3 class="font-label-lg text-label-lg text-on-surface mb-1">WhatsApp Message</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-[13px]">Fastest response</p>
</div>
</button>
<!-- Email -->
<button class="col-span-2 sm:col-span-1 bg-surface border border-outline-variant rounded-xl p-6 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors active:scale-[0.98] group">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">mail</span>
</div>
<div class="text-center">
<h3 class="font-label-lg text-label-lg text-on-surface mb-1">Send Email</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-[13px]">hello@royalspice.ng</p>
</div>
</button>
<!-- Website -->
<button class="col-span-2 sm:col-span-1 bg-surface border border-outline-variant rounded-xl p-6 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors active:scale-[0.98] group">
<div class="w-12 h-12 rounded-full bg-tertiary-container/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">language</span>
</div>
<div class="text-center">
<h3 class="font-label-lg text-label-lg text-on-surface mb-1">Visit Website</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-[13px]">royalspice.ng</p>
</div>
</button>
</section>
<!-- Business Hours / Status -->
<section class="mt-8 bg-surface-container-lowest border border-outline-variant rounded-xl p-5">
<div class="flex items-center justify-between mb-2">
<h4 class="font-label-lg text-label-lg text-on-surface">Current Status</h4>
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#16A34A]/10 text-[#16A34A] font-label-sm text-label-sm">
<span class="w-2 h-2 rounded-full bg-[#16A34A] animate-pulse"></span>
                    Open Now
                </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Closes at 10:00 PM</p>
</section>
</main>
<!-- Navigation suppressed as this is a focused, modal-like interaction screen branching off a business detail page -->
</body></html>
