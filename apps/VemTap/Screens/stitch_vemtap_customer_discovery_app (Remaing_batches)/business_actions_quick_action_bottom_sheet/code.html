</button>
</header>

<div>

<p class="font-body-md text-body-md text-on-surface-variant flex items-center">
<span class="material-symbols-outlined text-[16px] mr-1">location_on</span>

</div>
<div class="bg-primary-container text-on-primary-container px-2 py-1 rounded flex items-center gap-1">
<span class="font-label-sm text-label-sm font-bold">4.8</span>
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
</div>

</div>

<span class="font-label-sm text-label-sm mt-1">Account</span>
</div>

</button>
<button class="w-full flex items-center px-margin-main py-3.5 hover:bg-surface-container-low active:bg-surface-container transition-colors group">

<span class="material-symbols-outlined">forum</span>
