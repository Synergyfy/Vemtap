<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="bg-surface border-b border-outline-variant fixed top-0 w-full z-50 flex items-center justify-between px-margin-main h-touch-target-min">
<button aria-label="Go back" class="text-on-surface p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100 flex items-center justify-center h-touch-target-min w-touch-target-min">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Claim Deal</h1>
<div class="w-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-20 pb-24 px-margin-main flex flex-col gap-stack-lg max-w-md mx-auto w-full">
<!-- Deal Summary Card -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-4 flex gap-4 shadow-sm">
<div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0 bg-surface-container-low">
<img class="w-full h-full object-cover" data-alt="A modern, high-quality photograph showing a luxurious spa treatment room. Soft, warm lighting illuminates a pristine massage table with crisp white linens. In the background, subtle branding elements in VEMTAP Blue (#0055c4) are visible, creating a cohesive corporate modern aesthetic. The mood is relaxing and trustworthy." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRzH3byp7-4xl2SlRP9iL5Y4SnYOI2MQ0i4YfHzxHNWiP31BRto1v2JvuT9__DPc6nkjJlGaYjRL3piP9FxvTdFFThCruqfGQQGNo3Dddc_MVUxNTreN8459RqcQwb3J8-LQLi7hkUuAJyibyPblcwioO8lkW5cx33_sfCfLrjLaqGsckImbWg3QFZfRT1ZDRTxojLsKF2JyCO1OqCnOnZnhlwbQzkQoaqt6rIqXv9E62ltd4JA5eFoA"/>
</div>
<div class="flex flex-col justify-center">
<div class="inline-flex items-center gap-1 text-primary bg-primary-container/10 px-2 py-0.5 rounded text-[10px] font-bold tracking-wide uppercase mb-1 self-start">
<span class="material-symbols-outlined text-[12px]" data-icon="local_offer">local_offer</span>
                    50% OFF
                </div>
<h2 class="font-label-lg text-label-lg text-on-surface line-clamp-2">Premium Deep Tissue Massage Session</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Tranquil Spa &amp; Wellness</p>
</div>
</section>
<!-- Form Section -->
<section class="flex flex-col gap-stack-md">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-2">Your Information</h3>
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="fullName">Full Name</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="fullName" placeholder="Enter your full name" type="text" value="Sarah Jenkins"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="email" placeholder="Enter your email" type="email" value="sarah.j@example.com"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="phone">Phone Number</label>
<div class="flex gap-2">
<select class="h-12 px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all w-24">
<option>+234</option>
<option>+1</option>
<option>+44</option>
</select>
<input class="flex-grow h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="phone" placeholder="Enter phone number" type="tel"/>
</div>
</div>
</form>
</section>
<!-- Terms Agreement -->
<section class="mt-2 bg-surface-container-low p-4 rounded-lg">
<div class="flex items-start gap-3">
<input checked="" class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="terms" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant leading-tight" for="terms">
                    I agree to the <a class="text-primary font-medium hover:underline" href="#">Terms of Service</a> and confirm I want to claim this deal.
                </label>
</div>
</section>
</main>
<!-- Bottom Sticky Action -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant p-margin-main z-50">
<div class="max-w-md mx-auto">
<button class="w-full h-12 bg-primary text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container transition-colors active:scale-95 duration-100 shadow-sm">
                Claim Deal
                <span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
</button>
</div>
