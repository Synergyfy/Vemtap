</div>

<div class="w-10 h-1 bg-outline-variant rounded-full"></div>

<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors">

</button>
</div>

<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-sm text-label-sm min-h-touch-target-min flex items-center justify-center hover:bg-surface-container-low transition-colors">Fashion</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-sm text-label-sm min-h-touch-target-min flex items-center justify-center hover:bg-surface-container-low transition-colors">Electronics</button>

<span class="text-on-surface-variant">-</span>

<label class="relative flex items-center justify-center p-3 border border-outline-variant bg-surface rounded-lg cursor-pointer min-h-touch-target-min hover:bg-surface-container-low transition-colors">
